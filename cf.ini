custom_proxy_group=YOUTUBE`select`[]Auto`[]PROXY`[]🇭🇰`[]🇺🇲`[]🇹🇼`[]🇯🇵`.*
custom_proxy_group=PROXY`select`[]Auto`[]DIRECT`[]🇭🇰`[]🇺🇲`[]🇹🇼`[]🇯🇵`.*
custom_proxy_group=DOMESTIC`select`[]DIRECT`[]Auto`[]🇭🇰`[]🇺🇲`[]🇹🇼`[]🇯🇵`.*
